services:
  backend:
    build: ../backend
    volumes:
      - ../data:/data
    environment:
      VMS_DATABASE_URL: sqlite:////data/app.db
      VMS_STORAGE_ROOT: /data/releases
      VMS_SECRET_KEY: ${VMS_SECRET_KEY:?Set VMS_SECRET_KEY in deploy/.env}
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "18080:80"
    depends_on:
      - backend
    restart: unless-stopped
